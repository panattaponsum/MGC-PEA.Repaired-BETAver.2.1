    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Map Overlays */
        .map-container { position: relative; width: 100%; max-width: 100%; }
        .map-container img { width: 100%; height: auto; display: block; }
        .device-overlay {
            position: absolute; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 10;
        }
        .device-overlay.down {
            background-color: rgba(239, 68, 68, 0.6); border: 2px solid #fff;
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.0); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Status Tags */
        .tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
        .tag-ok { background: #dcfce7; color: #166534; }
        .tag-bad { background: #fee2e2; color: #991b1b; }
        
        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>

    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-80 hidden z-40 backdrop-blur-sm transition-opacity"></div>
    <div id="formModal" class="fixed inset-0 hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-5xl mx-4 flex flex-col max-h-[90vh] border border-slate-600">
            <div class="flex justify-between items-center p-5 border-b border-slate-700 bg-slate-900 rounded-t-xl">
                <div>
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fas fa-edit text-blue-500"></i> <span id="formTitle">บันทึกข้อมูล</span>
                    </h3>
                    <div class="mt-1 flex items-center gap-3 text-sm text-gray-400">
                        <span id="warrantyStatusDisplay"></span>
                        <span id="assetInfoDisplay"></span>
                        <button onclick="openAssetModal()" class="text-blue-400 hover:text-blue-300 underline text-xs">
                            <i class="fas fa-box-open"></i> แก้ไขข้อมูลทรัพย์สิน
                        </button>
                    </div>
                </div>
                <button onclick="closeForm()" class="text-gray-400 hover:text-white text-2xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-700 transition">&times;</button>
            </div>

            <div class="p-6 overflow-hidden flex flex-col md:flex-row gap-6 h-full">
                <div class="w-full md:w-1/2 space-y-4 overflow-y-auto custom-scrollbar pr-2">
                    <div class="bg-slate-700/30 p-4 rounded-lg border border-slate-600">
                        <label class="block text-xs font-medium text-gray-400 mb-1">ผู้บันทึก</label>
                        <input type="text" id="userName" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm" readonly>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">สถานะ</label>
                            <select id="status" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm focus:ring-2 focus:ring-blue-500">
                                <option value="down">❎ ชำรุด (Down)</option>
                                <option value="ok">✅ ใช้งานได้ (Normal)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">วันที่พบปัญหา</label>
                            <input type="date" id="brokenDate" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">วันที่ซ่อมเสร็จ</label>
                        <input type="date" id="fixedDate" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">รายละเอียด / อาการ / การแก้ไข</label>
                        <textarea id="description" rows="4" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm" placeholder="ระบุสาเหตุและการแก้ไข..."></textarea>
                    </div>

                    <div id="editHint" class="hidden bg-yellow-500/10 border border-yellow-500/30 text-yellow-200 text-xs p-3 rounded flex items-center gap-2">
                        <i class="fas fa-info-circle"></i> กำลังแก้ไขรายการเดิม
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button id="saveDataButton" onclick="saveData()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed font-medium">
                            <i class="fas fa-save mr-1"></i> บันทึก
                        </button>
                        <button onclick="clearForm()" class="px-4 bg-slate-600 hover:bg-slate-500 text-white rounded transition">
                            ล้างค่า
                        </button>
                    </div>
                    
                    <div class="pt-6 mt-4 border-t border-slate-700">
                        <button id="clearDeviceButton" onclick="clearCurrentDevice()" class="w-full text-red-400 hover:text-red-300 text-xs border border-red-900/50 hover:bg-red-900/20 p-2 rounded transition">
                            <i class="fas fa-trash-alt mr-1"></i> ล้างประวัติทั้งหมดของอุปกรณ์นี้
                        </button>
                    </div>
                </div>

                <div class="w-full md:w-1/2 bg-slate-900/50 rounded-lg border border-slate-700 flex flex-col h-full">
                    <div class="p-3 border-b border-slate-700 bg-slate-800/50 rounded-t-lg flex justify-between items-center">
                        <h4 class="text-white font-bold text-sm"><i class="fas fa-history mr-1"></i> ประวัติการซ่อม</h4>
                        <span class="text-xs text-gray-400" id="historyCount"></span>
                    </div>
                    
                    <div id="historySection" class="flex-grow overflow-y-auto p-3 space-y-3 custom-scrollbar">
                        </div>

                    <div class="p-3 border-t border-slate-700 flex justify-between items-center bg-slate-800/30 rounded-b-lg">
                        <button onclick="changeHistoryPage(-1)" id="btnPrevHist" class="text-xs bg-slate-700 text-white px-2 py-1 rounded disabled:opacity-30">Prev</button>
                        <span id="histPageIndicator" class="text-xs text-gray-400">Page 1</span>
                        <button onclick="changeHistoryPage(1)" id="btnNextHist" class="text-xs bg-slate-700 text-white px-2 py-1 rounded disabled:opacity-30">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="assetModal" class="fixed inset-0 hidden items-center justify-center z-[60] backdrop-blur-sm bg-black/80">
        <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-lg mx-4 border border-slate-500">
            <div class="flex justify-between items-center p-4 border-b border-slate-600 bg-slate-900 rounded-t-xl">
                <h3 class="text-lg font-bold text-white"><i class="fas fa-box mr-2"></i>แก้ไขข้อมูลทรัพย์สิน</h3>
                <button onclick="closeAssetModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Serial Number (S/N)</label>
                    <input type="text" id="assetSerial" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Model / รุ่น</label>
                        <input type="text" id="assetModel" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
                    </div>
                    <div>
                         <label class="block text-xs text-gray-400 mb-1">Manufacturer / ยี่ห้อ</label>
                         <input type="text" id="assetManufacturer" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white">
                    </div>
                </div>
                
                <div class="bg-slate-700/30 p-3 rounded border border-slate-600">
                    <p class="text-xs text-blue-300 mb-2 font-bold">ข้อมูลการรับประกัน</p>
                    <div class="grid grid-cols-2 gap-3">
                         <div>
                            <label class="block text-xs text-gray-400">วันเริ่มประกัน</label>
                            <input type="date" id="assetWarrantyStart" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs">
                        </div>
                        <div>
                             <label class="block text-xs text-gray-400">ระยะเวลา (ปี)</label>
                             <input type="number" id="assetWarrantyYears" step="1" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs" oninput="calculateWarrantyEnd()">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs text-gray-400">วันหมดประกัน (Auto)</label>
                            <input type="date" id="assetWarrantyEnd" class="w-full bg-slate-900 border border-slate-600 rounded p-1 text-white text-xs">
                        </div>
                    </div>
                </div>

                <div class="pt-2 text-right">
                    <button onclick="saveAssetData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded shadow text-sm">
                        💾 บันทึก
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
